modLoader = "javafml"
loaderVersion = "[0,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "hbmspace"
version = "${version}"
displayName = "NTM NEXT: Space"
iconFile = "hbmspace.png"
iconBlur = true
bannerFile = "hbmspace.png"
description = "NTM: Space, ported to Minecraft ${minecraft_version} for Fabric and NeoForge as an NTM addon."
authors = "JamesH_2 and Mellow, movblock"
credits = "JamesH_2 and Mellow: creating NTM: Space. movblock: porting to 26.2. Mr. Morgan: raw ore sprites and nickel, zinc, australium, niobium and lanthanium ore overlays."
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "hbmspace-common.mixins.json"

[[dependencies.hbmspace]]
modId = "hbm"
type = "required"
versionRange = "${hbm_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.hbmspace]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_next_version})"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbmspace]]
modId = "crankshaft"
type = "required"
versionRange = "[1.5.5,)"
ordering = "AFTER"
side = "CLIENT"
